<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Seguros Unimed</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        unimedDark: '#002B49',
                        unimedCyan: '#009EDB',
                        unimedGreen: '#009640'
                    }
                }
            }
        }
    </script>
    <style>
        .drag-active {
            border-color: #009640;
            background-color: #f0fdf4;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- Cabeçalho -->
    <header class="bg-unimedDark text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <!-- Espaço para logo.png -->
                <div class="bg-white rounded p-1 h-12 w-32 flex items-center justify-center overflow-hidden">
                    <img src="logo.png" alt="Logo Seguros Unimed" class="h-10 object-contain" onerror="this.outerHTML='<span class=\'text-unimedDark font-bold text-xs\'>[LOGO.PNG]</span>'">
                </div>
                <h1 class="text-2xl font-semibold">Extrator de Relatórios - Odonto</h1>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
        
        <!-- Drag and Drop Area -->
        <div id="drop-zone" class="border-4 border-dashed border-gray-300 rounded-xl p-10 text-center bg-white transition duration-300 ease-in-out cursor-pointer hover:border-unimedCyan">
            <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p class="text-lg text-gray-600 font-medium">Arraste e solte o ficheiro HTML do relatório aqui</p>
            <p class="text-sm text-gray-500 mt-2">ou clique para selecionar o ficheiro</p>
            <input type="file" id="file-input" class="hidden" accept=".html, .htm" />
        </div>

        <!-- Área de Resultados (Texto Extraído) -->
        <div id="result-section" class="hidden bg-white shadow-lg rounded-xl p-6 border-t-4 border-unimedGreen">
            <h2 class="text-xl font-bold text-unimedDark mb-4 flex items-center">
                <svg class="w-6 h-6 mr-2 text-unimedGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Dados Extraídos
            </h2>
            <div class="relative">
                <textarea id="output-text" rows="22" class="w-full p-4 border border-gray-300 rounded-lg bg-gray-50 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-unimedCyan whitespace-pre" readonly></textarea>
                <button onclick="copyToClipboard()" class="absolute top-2 right-2 bg-unimedCyan hover:bg-blue-600 text-white px-3 py-1 rounded text-sm font-medium transition shadow">Copiar</button>
            </div>
        </div>

        <!-- Painel da API (Dados do CNPJ) -->
        <div id="api-panel" class="hidden bg-white shadow-lg rounded-xl overflow-hidden border-t-4 border-unimedCyan">
            <div class="bg-gray-50 p-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-bold text-unimedDark flex items-center">
                    <svg class="w-6 h-6 mr-2 text-unimedCyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    Dados da Empresa (Receita Federal)
                </h2>
                <span id="api-loading" class="text-sm text-unimedCyan font-semibold animate-pulse hidden">A carregar dados...</span>
            </div>
            <div id="api-content" class="p-6">
                <!-- Conteúdo da API será injetado aqui -->
            </div>
        </div>

    </main>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        // Eventos de Drag & Drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) =>
