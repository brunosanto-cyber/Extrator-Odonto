<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Seguros Unimed</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        unimedDark: '#002B49',
                        unimedCyan: '#009EDB',
                        unimedGreen: '#009640'
                    }
                }
            }
        }
    </script>
    <style>
        .drag-active {
            border-color: #009640;
            background-color: #f0fdf4;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- Cabeçalho -->
    <header class="bg-unimedDark text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <!-- Espaço para logo.png -->
                <div class="bg-white rounded p-1 h-12 w-32 flex items-center justify-center overflow-hidden">
                    <img src="logo.png" alt="Logo Seguros Unimed" class="h-10 object-contain" onerror="this.outerHTML='<span class=\'text-unimedDark font-bold text-xs\'>[LOGO.PNG]</span>'">
                </div>
                <h1 class="text-2xl font-semibold">Extrator de Relatórios - Odonto</h1>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
        
        <!-- Drag and Drop Area -->
        <div id="drop-zone" class="border-4 border-dashed border-gray-300 rounded-xl p-10 text-center bg-white transition duration-300 ease-in-out cursor-pointer hover:border-unimedCyan">
            <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p class="text-lg text-gray-600 font-medium">Arraste e solte o ficheiro HTML do relatório aqui</p>
            <p class="text-sm text-gray-500 mt-2">ou clique para selecionar o ficheiro</p>
            <input type="file" id="file-input" class="hidden" accept=".html, .htm" />
        </div>

        <!-- Área de Resultados (Texto Extraído) -->
        <div id="result-section" class="hidden bg-white shadow-lg rounded-xl p-6 border-t-4 border-unimedGreen">
            <h2 class="text-xl font-bold text-unimedDark mb-4 flex items-center">
                <svg class="w-6 h-6 mr-2 text-unimedGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Dados Extraídos
            </h2>
            <div class="relative">
                <textarea id="output-text" rows="22" class="w-full p-4 border border-gray-300 rounded-lg bg-gray-50 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-unimedCyan whitespace-pre" readonly></textarea>
                <button onclick="copyToClipboard()" class="absolute top-2 right-2 bg-unimedCyan hover:bg-blue-600 text-white px-3 py-1 rounded text-sm font-medium transition shadow">Copiar</button>
            </div>
        </div>

        <!-- Painel da API (Dados do CNPJ) -->
        <div id="api-panel" class="hidden bg-white shadow-lg rounded-xl overflow-hidden border-t-4 border-unimedCyan">
            <div class="bg-gray-50 p-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-bold text-unimedDark flex items-center">
                    <svg class="w-6 h-6 mr-2 text-unimedCyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    Dados da Empresa (Receita Federal)
                </h2>
                <span id="api-loading" class="text-sm text-unimedCyan font-semibold animate-pulse hidden">A carregar dados...</span>
            </div>
            <div id="api-content" class="p-6">
                <!-- Conteúdo da API será injetado aqui -->
            </div>
        </div>

    </main>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        // Eventos de Drag & Drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-active');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-active'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
            if (e.dataTransfer.files.length > 0) processFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) processFile(e.target.files[0]);
        });

        // Limpeza de acentos para a Tabela B
        const removerAcentos = (str) => {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        };

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(e.target.result, 'text/html');
                extractData(doc);
            };
            reader.readAsText(file);
        }

        function extractData(doc) {
            // Função utilitária segura para capturar o texto dos IDs
            const getVal = (id) => {
                const el = doc.getElementById(id);
                if (!el) return '';
                // Limpa espaços duplos e quebras invisíveis geradas pelo HTML
                return el.innerText.replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim();
            };

            // ---- EXTRAÇÃO LINHAS 1 A 22 ----
            const linha1 = getVal('field_18'); 
            const cnaeFull = getVal('field_21'); 
            
            // Linha 2: Apenas números
            const linha2 = cnaeFull.replace(/[^\d]/g, ''); 
            
            // Linha 3: Remove apenas os primeiros números e traços do CNAE, mantendo as letras corretas
            const linha3 = cnaeFull.replace(/^[\d\-\.\s]+/, '').trim(); 
            
            const linha4 = "Funcionários + Dependentes";
            const linha5 = getVal('field_37'); 
            const cnpjFull = getVal('field_17'); 
            const linha6 = cnpjFull;

            // Busca na Tabela de Corretores (Linhas 7, 13 e 14)
            let linha7 = '';
            let taxaCorretagem = '0,00';
            let taxaAgenciamento = '0,00';
            const tabelaCorretores = doc.getElementById('customgrid_32');
            
            if (tabelaCorretores) {
                const rows = tabelaCorretores.querySelectorAll('tr');
                if (rows.length > 1) {
                    const headers = Array.from(rows[0].querySelectorAll('th, td')).map(th => th.innerText.trim().toLowerCase());
                    const colNome = headers.indexOf('nome');
                    const colTipo = headers.indexOf('tipo comissão');
                    const colTaxa = headers.indexOf('taxa comissão');

                    if (colNome !== -1) {
                        const firstDataRow = rows[1].querySelectorAll('td');
                        if (firstDataRow.length > colNome) linha7 = firstDataRow[colNome].innerText.trim();
                    }

                    if (colTipo !== -1 && colTaxa !== -1) {
                        for (let i = 1; i < rows.length; i++) {
                            const cols = rows[i].querySelectorAll('td');
                            if (cols.length > Math.max(colTipo, colTaxa)) {
                                const tipo = cols[colTipo].innerText.trim().toLowerCase();
                                const taxa = cols[colTaxa].innerText.trim();
                                if (tipo.includes('corretagem')) taxaCorretagem = taxa;
                                if (tipo.includes('agenciamento')) taxaAgenciamento = taxa;
                            }
                        }
                    }
                }
            }

            const linha8 = getVal('field_3'); 
            const linha9 = getVal('field_4'); 
            const linha10 = getVal('field_14'); 
            const linha11 = ''; // Deixar em branco
            const cnpjLimpo = cnpjFull.replace(/[^\d]/g, ''); 
            const linha12 = cnpjLimpo; 
            const linha13 = taxaCorretagem + '%';
            const linha14 = taxaAgenciamento + '%';
            const linha15 = getVal('field_77'); 
            
            // Linha 16: Tratamento do Reembolso Padrão (Ex: "1x Reembolso" -> "Reembolso 1x")
            let linha16 = getVal('field_40');
            if (linha16.toLowerCase() !== 'sem reembolso') {
                const matchReembolso = linha16.match(/^(\d+)x\s*reembolso$/i);
                if (matchReembolso) {
                    linha16 = `Reembolso ${matchReembolso[1]}x`;
                }
            }

            // Linha 17: Total de Vidas
            const linha17 = getVal('field_70');

            // Linha 18: Lógica da Congênere
            let linha18 = "Não possui apólice odontológica";
            const tabelaCongenere = doc.getElementById('customgrid_33');
            if (tabelaCongenere) {
                const rowsCongenere = tabelaCongenere.querySelectorAll('tr');
                if (rowsCongenere.length > 1) { // Tem dados além do cabeçalho
                    const tdsCongenere = rowsCongenere[1].querySelectorAll('td');
                    if (tdsCongenere.length > 0) {
                        const nomeCongenere = tdsCongenere[0].innerText.replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim();
                        if (nomeCongenere !== '') {
                            linha18 = "2 anos ou +";
                        }
                    }
                }
            }

            // Linha 19: Incluir na Campanha Mais Sorrisos
            const linha19 = getVal('field_64') || 'Não identificado';

            // Linha 20: Incluir Assistência SOS de Urgência
            const linha20 = getVal('field_65') || 'Não identificado';

            // Linha 21: Agenciamento (%) - Motor de Cálculos
            const linha21 = getVal('field_87');

            // Linha 22: Corretagem (%) - Motor de Cálculos
            const linha22 = getVal('field_85');

            // Agrupa textos fixos com a quebra exata
            let textoFinal = [
                linha1, linha2, linha3, linha4, linha5, 
                linha6, linha7, linha8, linha9, linha10, 
                linha11, linha12, linha13, linha14, linha15, 
                linha16, linha17, linha18, linha19, linha20,
                linha21, linha22
            ].join('\n') + '\n\n';

            // ---- TABELA A (COTAÇÃO) ----
            const tabelaA = doc.getElementById('customgrid_128');
            if (tabelaA) {
                textoFinal += "--- TABELA A (COTAÇÃO) ---\n";
                const rowsA = tabelaA.querySelectorAll('tr');
                if (rowsA.length > 0) {
                    const planosRegra = ["Essencial", "Essencial Plus", "Essencial Plus Doc", "Pleno", "Pleno Orto", "Pleno Top"];
                    let dadosExtraidos = [];
                    // Captura os cabeçalhos originais
                    let originalHeaders = Array.from(rowsA[0].querySelectorAll('th')).map(th => th.innerText.trim());

                    for (let i = 1; i < rowsA.length; i++) {
                        const tds = rowsA[i].querySelectorAll('td');
                        if (tds.length > 0) {
                            let rowObj = {};
                            originalHeaders.forEach((h, index) => {
                                rowObj[h] = tds[index] ? tds[index].innerText.trim() : '';
                            });
                            dadosExtraidos.push(rowObj);
                        }
                    }

                    // Verifica se existem planos fora da regra e adiciona ao final
                    const planosExtra = dadosExtraidos.map(d => d['Plano']).filter(p => !planosRegra.includes(p) && p);
                    const todosPlanos = [...planosRegra, ...planosExtra];

                    // INSERE O CABEÇALHO DA TABELA TRANSPOSTA COM OS NOMES DOS PLANOS
                    textoFinal += "Métrica/Plano\t" + todosPlanos.join('\t') + "\n";

                    // Transpõe os dados
                    originalHeaders.forEach(header => {
                        // Ignoramos a coluna "Plano" (que virou cabeçalho) e "ID_Plano" (desnecessária na exibição transposta)
                        if (header !== 'Plano' && header !== 'ID_Plano') {
                            let linhaTransposta = header + '\t';
                            todosPlanos.forEach(nomePlano => {
                                const dadoPlano = dadosExtraidos.find(d => d['Plano'] === nomePlano);
                                linhaTransposta += (dadoPlano ? dadoPlano[header] : '0') + '\t';
                            });
                            textoFinal += linhaTransposta.trim() + '\n';
                        }
                    });
                    textoFinal += '\n';
                }
            }

            // ---- TABELA B (DISTRIBUIÇÃO DE VIDAS) ----
            const tabelaB = doc.getElementById('customgrid_69');
            if (tabelaB) {
                textoFinal += "--- TABELA B (DISTRIBUIÇÃO DE VIDAS) ---\n";
                const rowsB = tabelaB.querySelectorAll('tr');
                rowsB.forEach((row, rowIndex) => {
                    let rowValues = [];
                    row.querySelectorAll('th, td').forEach((cell, cellIndex) => {
                        let text = cell.innerText.replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim();
                        // Aplica remoção de acentos apenas nas células de dados (td) da coluna Município (index 1)
                        if (rowIndex > 0 && cellIndex === 1 && cell.tagName.toLowerCase() === 'td') {
                            text = removerAcentos(text);
                        }
                        rowValues.push(text);
                    });
                    textoFinal += rowValues.join('\t') + '\n';
                });
            }

            // ---- FINALIZAÇÃO ----
            document.getElementById('output-text').value = textoFinal.trim();
            document.getElementById('result-section').classList.remove('hidden');

            // Chama a API da Receita Federal
            if(cnpjLimpo) fetchCnpjApi(cnpjLimpo);
        }

        function copyToClipboard() {
            const textarea = document.getElementById('output-text');
            textarea.select();
            document.execCommand('copy');
            alert('Dados copiados para a área de transferência!');
        }

        async function fetchCnpjApi(cnpj) {
            const panel = document.getElementById('api-panel');
            const content = document.getElementById('api-content');
            const loading = document.getElementById('api-loading');

            panel.classList.remove('hidden');
            content.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const response = await fetch(`https://open.cnpja.com/office/${cnpj}`);
                if(!response.ok) throw new Error('Falha ao buscar dados da API. Status: ' + response.status);
                
                const data = await response.json();
                
                // Formatação segura de Endereço
                const logradouro = `${data.address?.street || ''}, ${data.address?.number || ''} ${data.address?.details || ''}`.trim();
                const cidade = `${data.address?.city || ''} - ${data.address?.state || ''}`;

                let html = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Razão Social</p>
                            <p class="font-bold text-lg text-gray-800">${data.company?.name || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Nome Fantasia</p>
                            <p class="font-bold text-lg text-gray-800">${data.alias || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">CNPJ / Situação</p>
                            <p class="font-semibold text-gray-800">${data.taxId || 'N/A'} <span class="bg-unimedGreen text-white text-xs px-2 py-1 rounded ml-2">${data.status?.text || 'N/A'}</span></p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Data de Abertura</p>
                            <p class="font-semibold text-gray-800">${data.founded || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Natureza Jurídica</p>
                            <p class="font-semibold text-gray-800">${data.company?.nature?.text || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Capital Social</p>
                            <p class="font-semibold text-gray-800">R$ ${data.company?.equity ? Number(data.company.equity).toLocaleString('pt-BR') : 'N/A'}</p>
                        </div>
                        <div class="md:col-span-2">
                            <p class="text-sm text-gray-500 uppercase">Atividade Principal (CNAE)</p>
                            <p class="font-semibold text-gray-800">${data.mainActivity?.id || ''} - ${data.mainActivity?.text || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Logradouro / CEP</p>
                            <p class="font-semibold text-gray-800">${logradouro} (CEP: ${data.address?.zip || 'N/A'})</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Cidade / E-mail</p>
                            <p class="font-semibold text-gray-800">${cidade} <br/> <a href="mailto:${data.emails?.[0]?.address || ''}" class="text-unimedCyan hover:underline">${data.emails?.[0]?.address || 'N/A'}</a></p>
                        </div>
                    </div>
                `;

                if(data.company?.members && data.company.members.length > 0) {
                    html += `<div class="mt-8">
                                <h3 class="text-lg font-bold text-unimedDark mb-4 border-b pb-2">Quadro Societário (QSA)</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">`;
                    data.company.members.forEach(member => {
                        html += `
                            <div class="bg-gray-100 p-4 rounded-lg border border-gray-200 shadow-sm">
                                <p class="font-bold text-gray-800">${member.person?.name || 'N/A'}</p>
                                <p class="text-sm text-gray-600">${member.role?.text || 'Sócio'}</p>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                }

                content.innerHTML = html;

            } catch (error) {
                content.innerHTML = `<div class="bg-red-100 text-red-700 p-4 rounded border border-red-200">
                    <p class="font-bold">Erro ao consultar a API pública.</p>
                    <p class="text-sm mt-1">${error.message}</p>
                    <p class="text-xs mt-2 text-red-500">Nota: O CNPJ extraído pode ser inválido ou a API atingiu o limite de requisições gratuitas.</p>
                </div>`;
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
