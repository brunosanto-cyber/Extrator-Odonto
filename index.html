<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Seguros Unimed</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        unimedDark: '#002B49',
                        unimedCyan: '#009EDB',
                        unimedGreen: '#009640'
                    }
                }
            }
        }
    </script>
    <style>
        .drag-active {
            border-color: #009640;
            background-color: #f0fdf4;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- Cabeçalho -->
    <header class="bg-unimedDark text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <!-- Espaço para logo.png -->
                <div class="bg-white rounded p-1 h-12 w-32 flex items-center justify-center overflow-hidden">
                    <img src="logo.png" alt="Logo Seguros Unimed" class="h-10 object-contain" onerror="this.outerHTML='<span class=\'text-unimedDark font-bold text-xs\'>[LOGO.PNG]</span>'">
                </div>
                <h1 class="text-2xl font-semibold">Extrator de Relatórios - Odonto</h1>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
        
        <!-- Drag and Drop Area -->
        <div id="drop-zone" class="border-4 border-dashed border-gray-300 rounded-xl p-10 text-center bg-white transition duration-300 ease-in-out cursor-pointer hover:border-unimedCyan">
            <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p class="text-lg text-gray-600 font-medium">Arraste e solte o arquivo HTML do relatório aqui</p>
            <p class="text-sm text-gray-500 mt-2">ou clique para selecionar o arquivo</p>
            <input type="file" id="file-input" class="hidden" accept=".html, .htm" />
        </div>

        <!-- Área de Resultados (Texto Extraído) -->
        <div id="result-section" class="hidden bg-white shadow-lg rounded-xl p-6 border-t-4 border-unimedGreen">
            <h2 class="text-xl font-bold text-unimedDark mb-4 flex items-center">
                <svg class="w-6 h-6 mr-2 text-unimedGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Dados Extraídos
            </h2>
            <div class="relative">
                <textarea id="output-text" rows="12" class="w-full p-4 border border-gray-300 rounded-lg bg-gray-50 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-unimedCyan" readonly></textarea>
                <button onclick="copyToClipboard()" class="absolute top-2 right-2 bg-unimedCyan hover:bg-blue-600 text-white px-3 py-1 rounded text-sm font-medium transition shadow">Copiar</button>
            </div>
        </div>

        <!-- Painel da API (Dados do CNPJ) -->
        <div id="api-panel" class="hidden bg-white shadow-lg rounded-xl overflow-hidden border-t-4 border-unimedCyan">
            <div class="bg-gray-50 p-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-bold text-unimedDark flex items-center">
                    <svg class="w-6 h-6 mr-2 text-unimedCyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    Dados da Empresa (Receita Federal)
                </h2>
                <span id="api-loading" class="text-sm text-unimedCyan font-semibold animate-pulse hidden">Carregando dados...</span>
            </div>
            <div id="api-content" class="p-6">
                <!-- Conteúdo da API será injetado aqui -->
            </div>
        </div>

    </main>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        // Eventos de Drag & Drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-active');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-active'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
            if (e.dataTransfer.files.length > 0) processFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) processFile(e.target.files[0]);
        });

        // Função global para remover acentos e caracteres especiais como cedilha
        const removerAcentos = (str) => {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        };

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(e.target.result, 'text/html');
                extractData(doc);
            };
            reader.readAsText(file);
        }

        function extractData(doc) {
            const getVal = (id) => {
                const el = doc.getElementById(id);
                return el ? el.innerText.trim() : '';
            };

            // Linha 1 a 16
            const linha1 = getVal('field_18'); // Razão Social
            const cnaeFull = getVal('field_21'); 
            const linha2 = cnaeFull.replace(/[^0-9]/g, ''); // CNAE números
            const linha3 = cnaeFull.replace(/[0-9\-]/g, '').trim(); // CNAE letras
            const linha4 = "Funcionários + Dependentes";
            const linha5 = getVal('field_37'); // Tipo Contratação
            const cnpjFull = getVal('field_17'); // CNPJ
            const linha6 = cnpjFull;

            // Linha 7, 13 e 14: Tabela de Corretores
            let linha7 = '';
            let taxaCorretagem = '0,00';
            let taxaAgenciamento = '0,00';
            const tabelaCorretores = doc.getElementById('customgrid_32');
            if(tabelaCorretores) {
                const rows = tabelaCorretores.querySelectorAll('tr');
                if(rows.length > 1) {
                    const colunasLinha1 = rows[1].querySelectorAll('td');
                    if(colunasLinha1.length >= 3) linha7 = colunasLinha1[2].innerText.trim();
                }
                for(let i = 1; i < rows.length; i++) {
                    const cols = rows[i].querySelectorAll('td');
                    if(cols.length > 1) {
                        const tipo = cols[0].innerText.trim().toLowerCase();
                        if(tipo.includes('corretagem')) taxaCorretagem = cols[1].innerText.trim();
                        if(tipo.includes('agenciamento')) taxaAgenciamento = cols[1].innerText.trim();
                    }
                }
            }

            const linha8 = getVal('field_3'); // Nº Cotação
            const linha9 = getVal('field_4'); // Nº Cenário
            const linha10 = getVal('field_14'); // ER
            const linha11 = ''; // Em branco (Sexo Feminino ausente)
            const cnpjLimpo = cnpjFull.replace(/[\.\-\/]/g, ''); // CNPJ limpo
            const linha12 = cnpjLimpo; 
            const linha13 = taxaCorretagem + '%';
            const linha14 = taxaAgenciamento + '%';
            const linha15 = getVal('field_77'); // Diluição do Agenciamento
            
            // Lógica do Reembolso Padrão (Linha 16)
            let linha16 = getVal('field_40');
            const regexReembolso = /^(\d+x)\s+reembolso$/i;
            if (regexReembolso.test(linha16)) {
                // Inverte "2x Reembolso" para "Reembolso 2x"
                linha16 = linha16.replace(regexReembolso, 'Reembolso $1');
            }

            let textoFinal = [linha1, linha2, linha3, linha4, linha5, linha6, linha7, linha8, linha9, linha10, linha11, linha12, linha13, linha14, linha15, linha16].join('\n') + '\n\n';

            // Tabela A (customgrid_128) - Transposição com Regra Estrita
            const tabelaA = doc.getElementById('customgrid_128');
            if(tabelaA) {
                const rowsA = tabelaA.querySelectorAll('tr');
                const planosRegra = ["Essencial", "Essencial Plus", "Essencial Plus Doc", "Pleno", "Pleno Orto", "Pleno Top"];
                let dadosExtraidos = [];
                let headers = [];

                if(rowsA.length > 0) {
                    const ths = rowsA[0].querySelectorAll('th');
                    ths.forEach(th => headers.push(th.innerText.trim()));
                }

                for(let i = 1; i < rowsA.length; i++) {
                    const tds = rowsA[i].querySelectorAll('td');
                    if(tds.length > 0) {
                        let linhaObj = {};
                        headers.forEach((h, index) => {
                            linhaObj[h] = tds[index] ? tds[index].innerText.trim() : '';
                        });
                        dadosExtraidos.push(linhaObj);
                    }
                }

                // Identificar planos presentes e não presentes
                const planosRestantes = dadosExtraidos.filter(d => !planosRegra.includes(d['Plano']));
                const todosPlanosOrdenados = [...planosRegra, ...planosRestantes.map(d => d['Plano'])];

                // Montar tabela transposta
                textoFinal += "--- TABELA A (COTAÇÃO) ---\n";
                headers.forEach(header => {
                    if(header !== 'Plano') {
                        let linhaTransposta = header + '\t';
                        todosPlanosOrdenados.forEach(nomePlano => {
                            const dadoPlano = dadosExtraidos.find(d => d['Plano'] === nomePlano);
                            linhaTransposta += (dadoPlano ? dadoPlano[header] : '0') + '\t';
                        });
                        textoFinal += linhaTransposta.trim() + '\n';
                    }
                });
                textoFinal += '\n';
            }

            // Tabela B (customgrid_69) - Cópia com Tabs e sem acentos na coluna Município
            const tabelaB = doc.getElementById('customgrid_69');
            if(tabelaB) {
                textoFinal += "--- TABELA B (DISTRIBUIÇÃO DE VIDAS) ---\n";
                const rowsB = tabelaB.querySelectorAll('tr');
                rowsB.forEach(row => {
                    let linhaStr = [];
                    row.querySelectorAll('th, td').forEach((cell, index) => {
                        let texto = cell.innerText.trim();
                        // O índice 1 corresponde à coluna "Município"
                        if(index === 1) {
                            texto = removerAcentos(texto);
                        }
                        linhaStr.push(texto);
                    });
                    textoFinal += linhaStr.join('\t') + '\n';
                });
            }

            // Exibir Resultados
            document.getElementById('output-text').value = textoFinal.trim();
            document.getElementById('result-section').classList.remove('hidden');

            // Chamar API
            if(cnpjLimpo) fetchCnpjApi(cnpjLimpo);
        }

        function copyToClipboard() {
            const textarea = document.getElementById('output-text');
            textarea.select();
            document.execCommand('copy');
            alert('Dados copiados para a área de transferência!');
        }

        async function fetchCnpjApi(cnpj) {
            const panel = document.getElementById('api-panel');
            const content = document.getElementById('api-content');
            const loading = document.getElementById('api-loading');

            panel.classList.remove('hidden');
            content.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const response = await fetch(`https://open.cnpja.com/office/${cnpj}`);
                if(!response.ok) throw new Error('Falha ao buscar dados da API. Status: ' + response.status);
                
                const data = await response.json();
                
                // Tratar endereços
                const logradouro = `${data.address?.street || ''}, ${data.address?.number || ''} ${data.address?.details || ''}`.trim();
                const cidade = `${data.address?.city || ''} - ${data.address?.state || ''}`;

                // HTML Base do retorno
                let html = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Razão Social</p>
                            <p class="font-bold text-lg text-gray-800">${data.company?.name || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Nome Fantasia</p>
                            <p class="font-bold text-lg text-gray-800">${data.alias || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">CNPJ / Situação</p>
                            <p class="font-semibold text-gray-800">${data.taxId || 'N/A'} <span class="bg-unimedGreen text-white text-xs px-2 py-1 rounded ml-2">${data.status?.text || 'N/A'}</span></p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Data de Abertura</p>
                            <p class="font-semibold text-gray-800">${data.founded || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Natureza Jurídica</p>
                            <p class="font-semibold text-gray-800">${data.company?.nature?.text || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Capital Social</p>
                            <p class="font-semibold text-gray-800">R$ ${data.company?.equity ? Number(data.company.equity).toLocaleString('pt-BR') : 'N/A'}</p>
                        </div>
                        <div class="md:col-span-2">
                            <p class="text-sm text-gray-500 uppercase">Atividade Principal (CNAE)</p>
                            <p class="font-semibold text-gray-800">${data.mainActivity?.id || ''} - ${data.mainActivity?.text || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Logradouro / CEP</p>
                            <p class="font-semibold text-gray-800">${logradouro} (CEP: ${data.address?.zip || 'N/A'})</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 uppercase">Cidade / E-mail</p>
                            <p class="font-semibold text-gray-800">${cidade} <br/> <a href="mailto:${data.emails?.[0]?.address || ''}" class="text-unimedCyan hover:underline">${data.emails?.[0]?.address || 'N/A'}</a></p>
                        </div>
                    </div>
                `;

                // Renderizar QSA (Quadro Societário)
                if(data.company?.members && data.company.members.length > 0) {
                    html += `<div class="mt-8">
                                <h3 class="text-lg font-bold text-unimedDark mb-4 border-b pb-2">Quadro Societário (QSA)</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">`;
                    data.company.members.forEach(member => {
                        html += `
                            <div class="bg-gray-100 p-4 rounded-lg border border-gray-200 shadow-sm">
                                <p class="font-bold text-gray-800">${member.person?.name || 'N/A'}</p>
                                <p class="text-sm text-gray-600">${member.role?.text || 'Sócio'}</p>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                }

                content.innerHTML = html;

            } catch (error) {
                content.innerHTML = `<div class="bg-red-100 text-red-700 p-4 rounded border border-red-200">
                    <p class="font-bold">Erro ao consultar a API pública.</p>
                    <p class="text-sm mt-1">${error.message}</p>
                    <p class="text-xs mt-2 text-red-500">Nota: O CNPJ extraído pode ser inválido ou a API atingiu o limite de requisições gratuitas.</p>
                </div>`;
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
